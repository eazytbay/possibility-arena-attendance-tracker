<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{% block title %}Attendance{% endblock %} · {{ church_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body><main>
{% block nav %}{% endblock %}
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="note" role="status">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
<script>
const CSRF=document.querySelector('meta[name=csrf-token]').content;
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},body:JSON.stringify(body||{})});return {ok:r.ok,data:await r.json().catch(()=>({}))}}
</script>
{% block script %}{% endblock %}
</body></html>
