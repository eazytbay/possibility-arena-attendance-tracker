{% extends "base.html" %}{% block title %}Admin login{% endblock %}
{% block hero %}<section class="hero"><div class="in">
<img class="seal-lg" src="{{ url_for('static', filename='rccg-seal.png') }}" alt="" width="96" height="96">
<h1>Admin login</h1><p>Authorised team members only</p></div></section>{% endblock %}
{% block body %}<div class="sheet">
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="u" style="margin-top:0">Email or username</label><input id="u" name="username" autocomplete="username" required autofocus>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button class="full" type="submit">Log in</button>
</form></div>{% endblock %}
